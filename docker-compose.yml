services:
    backend:
        build: ./backend
        environment:
            SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/db
        networks:
            - app-network
        depends_on:
            - database

    database:
        build: ./database
        networks:
            - app-network
        volumes:
            - database-data:/var/lib/postgresql/data

    server:
        build: ./server
        ports:
            - "80:80"
        networks:
            - app-network
        depends_on:
            - backend

networks:
  app-network:

volumes:
  database-data:
